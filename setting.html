<!DOCTYPE html>
<html>

<head>

<title>Settings</title>

<style>

body{

    margin:0;
    font-family:Arial, sans-serif;
    background:#071426;
    color:white;

}


.container{

    padding:30px;

}


.settings-card{

    background:rgba(255,255,255,0.12);
    padding:25px;
    border-radius:20px;

}


.option{

    background:rgba(255,255,255,0.15);
    padding:15px;
    margin:15px 0;
    border-radius:12px;

}


button{

    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    cursor:pointer;

}


.logout{

    background:#ff4444;
    color:white;

}


a{

    color:white;
    text-decoration:none;

}

</style>

</head>


<body>


<div class="container">


<div class="settings-card">


<h2>Settings</h2>


<div class="option">

<h3>Account Security</h3>

<p>Keep your account protected.</p>

</div>



<div class="option">

<h3>Notifications</h3>

<p>Manage your alerts and messages.</p>

</div>



<div class="option">

<h3>Privacy</h3>

<p>Control your account visibility.</p>

</div>



<button class="logout" onclick="logout()">

Logout

</button>



<br><br>

<a href="dashboard.html">
← Back to Dashboard
</a>



</div>

</div>



<script>


function logout(){

localStorage.removeItem("loggedInUser");

window.location.href="login.html";

}


</script>


</body>

</html>
