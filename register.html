<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VERTEX - Register</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="register-container">


<h1>VERTEX</h1>

<h2>Create Account</h2>


<form id="registerForm">


<input 
type="text" 
id="firstname" 
placeholder="First Name"
required>


<input 
type="text" 
id="middlename" 
placeholder="Middle Name">


<input 
type="text" 
id="lastname" 
placeholder="Last Name"
required>


<input 
type="text" 
id="username" 
placeholder="Username"
required>


<input 
type="email" 
id="email" 
placeholder="Email Address"
required>


<input 
type="tel" 
id="phone" 
placeholder="Phone Number"
required>


<select id="country" required>

<option value="">
Select Country
</option>

<option>
Nigeria
</option>

<option>
United States
</option>

<option>
Canada
</option>

<option>
United Kingdom
</option>

<option>
Germany
</option>

<option>
France
</option>

<option>
Australia
</option>

</select>



<input 
type="password" 
id="password" 
placeholder="Password"
required>


<input 
type="password" 
id="confirmPassword" 
placeholder="Confirm Password"
required>



<button type="submit">

Create Account

</button>



</form>


<p>

Already have an account?

<a href="login.html">
Login
</a>

</p>


</div>



<script src="js/register.js"></script>


</body>

</html>
