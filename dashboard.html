<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Loading screen */
#loader {
    position: fixed;
    width: 100%;
    height: 100vh;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 25px;
    z-index: 999;
}

body {
    min-height: 100vh;
    background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url("key-background.jpg");

    background-size: cover;
    background-position: center;
    color: white;
}


/* Dashboard */
.dashboard {
    padding: 40px;
}

.welcome {
    font-size: 32px;
    margin-bottom: 30px;
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
}

nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    display: flex;
    justify-content: space-around;
}

nav a {
    color: white;
    text-decoration: none;
}

</style>

</head>

<body>


<div id="loader">
Loading...
</div>


<div class="dashboard">

<div class="welcome">
Hi <span id="username">User</span> 👋
</div>


<div class="card">
<h2>Account Overview</h2>
<p>Your dashboard is ready.</p>
</div>


<div class="card">
<h2>Profile</h2>
<p>Edit your personal information here.</p>
</div>


<div class="card">
<h2>Security</h2>
<p>Your account protection settings.</p>
</div>


</div>


<nav>
<a href="#">Dashboard</a>
<a href="#">Account</a>
<a href="#">Settings</a>
</nav>



<script>

// 5 seconds loading
setTimeout(function(){
    document.getElementById("loader").style.display="none";
},5000);


// Example username display
let registeredName = "Jennifer";

document.getElementById("username").innerHTML = registeredName;


</script>


</body>
</html>
