<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Platform Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <header class="top-bar">
        <div class="logo">
            ◢V◣ Vertex Platform
        </div>

        <button class="menu-btn">
            ☰
        </button>
    </header>


    <section class="welcome">
        <h1>Welcome Back</h1>
        <p>Manage your account from your dashboard</p>
    </section>


    <section class="overview-card">

        <h2>Account Overview</h2>

        <div class="balance">
            <p>Account Balance</p>
            <h1>$0.00</h1>
        </div>

        <p>Status: <strong>Active</strong></p>

    </section>


    <section class="action-grid">

        <a href="account.html" class="action-card">
            <h3>My Account</h3>
            <p>View profile details</p>
        </a>


        <a href="deposit.html" class="action-card">
            <h3>Deposit</h3>
            <p>Add funds to your account</p>
        </a>


        <a href="#" class="action-card">
            <h3>Activity</h3>
            <p>View account activity</p>
        </a>


        <a href="login.html" class="action-card">
            <h3>Logout</h3>
            <p>Sign out securely</p>
        </a>

    </section>


</div>

<script src="script.js"></script>

</body>
</html>
