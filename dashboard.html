<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Platform Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Top Navigation -->
    <header class="top-bar">

        <div class="logo">
            ◢V◣ Vertex Platform
        </div>

        <button class="menu-btn">
            ☰
        </button>

    </header>


    <!-- Welcome -->
    <section class="welcome">
        <h1>Welcome Back</h1>
        <p>Your personal platform dashboard</p>
    </section>


    <!-- Account Overview -->
    <section class="overview-card">

        <h2>Account Overview</h2>

        <div class="balance">
            <p>Total Balance</p>
            <h1>$0.00</h1>
        </div>

        <div class="status">
            <p>Account Status: <strong>Active</strong></p>
        </div>

    </section>


    <!-- Quick Actions -->
    <section class="action-grid">

        <a href="account.html" class="action-card">
            <h3>👤 Account</h3>
            <p>Manage your profile</p>
        </a>


        <a href="deposit.html" class="action-card">
            <h3>💳 Deposit</h3>
            <p>Add funds</p>
        </a>


        <a href="#" class="action-card">
            <h3>📊 Activity</h3>
            <p>View account activity</p>
        </a>


        <a href="login.html" class="action-card">
            <h3>🚪 Logout</h3>
            <p>Securely exit</p>
        </a>

    </section>


</div>


<script src="script.js"></script>

</body>
</html>
