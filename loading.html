<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#071426;
            color:white;
            font-family:Arial, sans-serif;
        }

        .loader-box{
            text-align:center;
        }

        .loader{
            width:60px;
            height:60px;
            border:6px solid rgba(255,255,255,0.3);
            border-top:6px solid white;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin:auto;
        }

        @keyframes spin{
            100%{
                transform:rotate(360deg);
            }
        }

        h2{
            margin-top:20px;
        }
    </style>

</head>

<body>

<div class="loader-box">

    <div class="loader"></div>

    <h2>Loading your account...</h2>

</div>


<script>

setTimeout(function(){

    window.location.href="dashboard.html";

},5000);


</script>


</body>
</html>
